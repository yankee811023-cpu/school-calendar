<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학사일정 시뮬레이터</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- Firebase SDK (v9 Web CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  </head>
  <body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // Firebase 초기화 (안전 설정)
      const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

      if (firebaseConfig.apiKey && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      function App() {
        const [isReady, setIsReady] = useState(false);
        const [user, setUser] = useState('');
        const [userNameInput, setUserNameInput] = useState('');
        
        // 학사일정 기본값
        const [startDate, setStartDate] = useState('2027-03-02');
        const [semester2StartDate, setSemester2StartDate] = useState('2027-08-26');
        const [selectedOptional, setSelectedOptional] = useState(['2027-05-04']);
        const [selectedScheduleOption, setSelectedScheduleOption] = useState(98);
        const [scheduleOpinions, setScheduleOpinions] = useState([]);

        // 법정 공휴일
        const baseHolidays = [
          { date: '2027-05-03', name: '대체공휴일(노동절)' },
          { date: '2027-05-05', name: '어린이날' },
          { date: '2027-05-13', name: '부처님오신날' },
          { date: '2027-07-19', name: '대체공휴일(제헌절)' },
          { date: '2027-08-16', name: '대체공휴일(광복절)' },
          { date: '2027-09-14', name: '추석 연휴' },
          { date: '2027-09-15', name: '추석' },
          { date: '2027-09-16', name: '추석 연휴' },
          { date: '2027-10-04', name: '대체공휴일(개천절)' },
          { date: '2027-10-11', name: '대체공휴일(한글날)' },
          { date: '2027-12-25', name: '크리스마스' },
          { date: '2027-12-27', name: '대체공휴일(크리스마스)' }
        ];

        // 재량휴업일 옵션 목록
        const optionalHolidaysList = [
          { date: '2027-05-04', name: '5/4 재량휴업일' },
          { date: '2027-05-14', name: '5/14 재량휴업일' },
          { date: '2027-09-13', name: '9/13 재량휴업일' },
          { date: '2027-09-17', name: '9/17 재량휴업일' }
        ];

        useEffect(() => {
          if (firebase.apps.length) {
            firebase.auth().signInAnonymously().then(() => setIsReady(true)).catch(() => setIsReady(true));
          } else {
            setIsReady(true);
          }
        }, []);

        // 재량휴업일 토글
        const handleToggleOptional = (date) => {
          if (selectedOptional.includes(date)) {
            setSelectedOptional(selectedOptional.filter(d => d !== date));
          } else {
            setSelectedOptional([...selectedOptional, date]);
          }
        };

        // 의견 제출
        const handleSubmitOpinion = () => {
          if (!userNameInput.trim()) return alert('성함을 입력해 주세요.');
          setUser(userNameInput);
          alert(`${userNameInput} 선생님의 학사일정 의견이 제출되었습니다.`);
        };

        return (
          <div className="max-w-4xl mx-auto p-6">
            <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
              <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                <span>📅</span> 학사일정 시뮬레이터 & 교사 의견 수합 도구
              </h1>
              <p className="text-slate-600 text-sm mt-1">2027학년도 수업일수 계산 및 재량휴업일 의견 제출 서비스</p>
            </header>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {/* 왼쪽 입력 영역 */}
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 className="text-lg font-bold text-slate-800 mb-4 pb-2 border-b">⚙️ 일정 설정</h2>
                
                <div className="mb-4">
                  <label className="block text-sm font-medium text-slate-700 mb-1">개학일</label>
                  <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full p-2 border rounded-lg text-sm" />
                </div>

                <div className="mb-4">
                  <label className="block text-sm font-medium text-slate-700 mb-1">2학기 시작일</label>
                  <input type="date" value={semester2StartDate} onChange={e => setSemester2StartDate(e.target.value)} className="w-full p-2 border rounded-lg text-sm" />
                </div>

                <div className="mb-4">
                  <label className="block text-sm font-medium text-slate-700 mb-2">재량휴업일 선택</label>
                  <div className="space-y-2">
                    {optionalHolidaysList.map(item => (
                      <label key={item.date} className="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                        <input 
                          type="checkbox" 
                          checked={selectedOptional.includes(item.date)} 
                          onChange={() => handleToggleOptional(item.date)}
                          className="rounded text-indigo-600"
                        />
                        {item.name}
                      </label>
                    ))}
                  </div>
                </div>
              </div>

              {/* 중앙 및 오른쪽: 시뮬레이션 결과 및 의견 작성 */}
              <div className="md:col-span-2 space-y-6">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <h2 className="text-lg font-bold text-slate-800 mb-4 pb-2 border-b">📊 일정 시뮬레이션 결과</h2>
                  <div className="grid grid-cols-2 gap-4 text-center">
                    <div className="p-4 bg-indigo-50 rounded-xl">
                      <div className="text-sm text-indigo-600 font-medium">선택된 재량휴업일</div>
                      <div className="text-2xl font-bold text-indigo-900 mt-1">{selectedOptional.length} 일</div>
                    </div>
                    <div className="p-4 bg-emerald-50 rounded-xl">
                      <div className="text-sm text-emerald-600 font-medium">기본 공휴일</div>
                      <div className="text-2xl font-bold text-emerald-900 mt-1">{baseHolidays.length} 일</div>
                    </div>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <h2 className="text-lg font-bold text-slate-800 mb-4 pb-2 border-b">✍️ 교사 의견 제출</h2>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">선생님 성함</label>
                      <input 
                        type="text" 
                        placeholder="성함을 입력해 주세요" 
                        value={userNameInput} 
                        onChange={e => setUserNameInput(e.target.value)} 
                        className="w-full p-2.5 border rounded-lg text-sm"
                      />
                    </div>
                    <button 
                      onClick={handleSubmitOpinion} 
                      className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-md"
                    >
                      의견 수합 제출하기
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
